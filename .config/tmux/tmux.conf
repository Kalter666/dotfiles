set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g default-terminal "tmux-256color"

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -n M-H previous-window
bind -n M-L next-window

bind-key -r f run-shell "tmux neww ~/.config/scripts/tmux-sessionizer"

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-interval 5

setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/" 

# Catppuccin theme configuration
set -g @catppuccin_flavor 'mocha' #'latte' # or frappe, macchiato, mocha
set -g @catppuccin_window_flags "none" # "text"

set -g @catppuccin_window_current_text " #{b:pane_current_path}|#W"
set -g @catppuccin_window_text " #{b:pane_current_path}|#W"
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_gitmux}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
run ~/.tmux/plugins/tmux-cpu/cpu.tmux

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-cpu'

run '~/.tmux/plugins/tpm/tpm'

#set v mode
set-window-option -g mode-keys vi
# set keybinding
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-option -g detach-on-destroy off

set -g allow-passthrough on

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
